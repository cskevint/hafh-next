# Typecheck, lint and build on every push and PR.
#
# Why this exists at all: `next build` stopped running ESLint in Next 16, so
# nothing was checking lint before deploy. Vercel builds on push and would
# happily ship lint errors. This is the only thing that catches them.
#
# Deliberately NOT here: `npm run check:redirects`. It fires ~51 requests at
# production in a burst, including 8 known-dead .php paths, which Vercel's
# automatic DDoS mitigation reads as vulnerability scanning — it then returns
# 403 with `x-vercel-mitigated: challenge` on every path for a sustained
# period. Run it by hand after a cutover, with a firewall system-bypass for
# the IP you run it from. See plans/2026-07-26-php-to-nextjs-migration.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node version the Vercel project builds with, so a
          # green run here means the same thing as a green deploy.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Separate step so a lint failure is distinguishable from a type error
      # at a glance in the checks UI.
      - run: npm run lint

      - run: npm run build
